version: 2

builds:
  - id: beaconcast
    main: ./cmd/beaconcast
    binary: beaconcast
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - CHANGELOG.md
      - LICENSE
      - README.md
      - THIRD_PARTY_NOTICES.md
      - internal/fonts/OFL.txt
      - licenses/**/*

checksum:
  name_template: checksums.txt

# Release notes come from CHANGELOG.md through --release-notes; see
# .github/workflows/release.yml. Do not set changelog.disable: it also drops
# the notes passed with --release-notes.
